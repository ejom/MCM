[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcm-phone-power-model"
version = "0.1.0"
description = "Physics-based smartphone battery drain model for MCM 2026"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
run-model = "main:__main__"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["deprecated/"]
